<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理画面</title>
    <style>
        body {
            margin: 0;
            background-color: #eef2f5;
            font-family: sans-serif;
        }

        /* 1〜4.3の全体を包む親：ここで横並びにする */
        .wrapper {
            display: flex;
            width: 100%;
            /* max-width: 1200px; */
            /* パソコンで見やすいサイズ */
            margin: 0 auto;
            /* 画面の真ん中に寄せる */
            min-height: 100vh;
        }

        /* ==========================================
           3. サイドバー（左側のリモコン領域）
        =========================================== */
        .plbutton-main {
            width: 30%;
            padding: 15px;
            background-color: #2c3e50;
            max-width: 230px;
            /* 格好いい濃いネイビー */
            min-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            /* 子供を親と一緒のサイズに引っ張る */
            box-sizing: border-box;
            /* 親のサイズを超えないようにするpaddingとかが足されて親より大きくなるから
 */
        }

        .plbutton-button {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 12px;
            font-size: 14px;
            /* font-weight: bold; */
            background-color: white;
            /* border: none;
            border-radius: 6px;
            cursor: pointer; */
            text-align: center;
        }

        .plbutton-button:hover {
            background-color: #e0e0e0;
        }

        /* 文字 */
        h1 {
            font-size: 18px;
            text-align: center;
            color: #333;
            /* margin-top: 0; */
        }

        /* ==========================================
           4. 画面表示エリア（右側のメインコンテンツ領域）
        =========================================== */
        .main-content {
            flex: 1;

            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            /* box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); */
        }

        /* 各部屋の表示・非表示ルール */
        .content-check {
            display: block;
            /* 最初はこちらを表示 */
        }

        .content-build {
            display: none;
            /* 最初は隠しておく */
        }

        /* シフトカードたちのデザイン（元のやつをそのままキープ） */
        .shift-card {
            background: #fff;
            border: 1px solid #ddd;
            border-left: 6px solid #007bff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .staff-name {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }

        .date-list {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .btn-clear {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .text-name {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
            text-align: left;
        }

        .text-message {
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            font-size: 14px;
            color: #555;
            width: 100%;
            white-space: pre-wrap;
            box-sizing: border-box;
            text-align: left;
        }

        .design01 {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            /* 重なる線を１ピクセルで表示するために使用 */
            border-spacing: 0;
        }

        .design01 th {
            padding: 10px;
            background: #e9faf9;
            border: solid 1px #778ca3;
        }

        .design01 th.yasumi {
            padding: 10px;
            background: #6ee70b;
            border: solid 1px #e90134;
        }

        .design01 th.name {
            padding: 10px;
            background: #bd6c6c;
            border: solid 1px #e90134;
        }

        .design01 td {
            padding: 10px;
            border: solid 1px #006fe6;
        }

        /* 名前のセルの基本スタイル（枠線がズレないように元から透明な枠を持たせるか、box-sizingを指定） */
        .staff-name {
            cursor: pointer;
            /* マウスカーソルをポインターにする場合 */
            box-sizing: border-box;
            position: relative;
            transition: outline 0.1s ease;
            /* アニメーションを滑らかにする場合 */
        }

        /* ホバー時に枠線を表示する */
        .staff-name:hover {
            content: "テスト表示OK！";
            position: absolute;
            outline: 2px solid #007bff;
            /* 青色の枠線 */
            /* または内部に枠線を出したい場合: */
            /* box-shadow: inset 0 0 0 2px #007bff; */
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="plbutton-main">
            <button class="plbutton-button" onclick="switchPage('check')">📥 希望一覧 (Check)</button>
            <button class="plbutton-button" onclick="switchPage('build')">🛠️ シフト作成 (Build)</button>
        </div>

        <div class="main-content">

            <div id="page-check" class="content-check">
                <button class="btn-clear" onclick="alert('C#のデータ削除機能は後ほど実装します！')">データを全削除</button>


                <table id="shift_create" class="design01">

                    <tr id="shift_name">
                        <th>名前</th>

                    </tr>



                </table>


                <h1>📥 受信したシフト希望一覧（管理画面）</h1>
                <div id="admin-history-container"></div>
            </div>

            <div id="page-build" class="content-build">
                <h1>🛠️ シフト作成・チェック用画面</h1>
                <p style="text-align: center; color: #666;">ここに将来、カレンダーや組み立て機能を実装します！</p>
            </div>

        </div>

    </div>

    <script>


        const staffShifts = [
            {
                id: 1,
                name: "藤本",
                isSubmitted: true,  // 💡 YES：シフト提出済み！
                isApproved: true,   // 💡 YES：管理者も承認・確定済み！
                currentMonthShifts: [
                    { date: "2026-06-01", mode: "日勤" },
                    { date: "2026-06-06", mode: "遅番" },
                    { date: "2026-06-09", mode: "休み" }
                ]
            },
            {
                id: 2,
                name: "佐藤",
                isSubmitted: true,  // 💡 YES：シフトは提出してくれた！
                isApproved: false,  // 💡 NO ：管理者がまだ調整中で未承認。
                currentMonthShifts: [
                    { date: "2026-06-04", mode: "休み" },
                    { date: "2026-06-16", mode: "休み" },
                    { date: "2026-06-20", mode: "遅番" }
                ]
            },
            {
                id: 3,
                name: "田中ccccc",
                isSubmitted: false, // 💡 NO ：そもそもまだ今月のシフトを出してない！
                isApproved: false,  // 💡 NO ：出してないので、もちろん未承認。
                currentMonthShifts: [
                    { date: "2026-06-09", mode: "日勤" },
                    { date: "2026-06-29", mode: "休み" },
                    { date: "2026-06-30", mode: "遅番" } // ※6月は30日までなので、30日に修正しておきました！
                ]
            }
        ];


        //月の判定ができてないよ

        document.addEventListener('DOMContentLoaded', function () {

            const tbody = document.getElementById('shift_name');
            const tbody2 = document.getElementById('shift_create');
            tbody.innerHTML = ''; // 一度中身をクリア


            const eventSetting = [
                { key: 'isSubmitted', TrueText: 'OK', FalseText: 'NO' },
                { key: 'isApproved', TrueText: 'OK', FalseText: 'NO' }
            ];


            const days = new Date(2026, 6, 0).getDate();////////////////////////////
            const thn = document.createElement('th')
            thn.classList.add('name');
            thn.textContent = "名前";
            tbody.appendChild(thn);

            for (let i = 1; i <= days; i++) {//日を入れている
                const th = document.createElement('th')
                th.textContent = i;
                tbody.appendChild(th);
            }

            eventSetting.forEach(setting => {//イベントの処理
                const the = document.createElement('th')
                the.classList.add('yasumi');
                the.textContent = "sssssss";/////////////
                tbody.appendChild(the);
            });


            staffShifts.forEach(staff => {//初期値がいる名前追加

                const td = document.createElement('td')
                td.classList.add('staff-name');
                const tr = document.createElement('tr')
                td.textContent = staff.name;

                const shiftLookup = {};
                staff.currentMonthShifts.forEach(shift => {//currentMonthShiftsの中にdateとmodeがあるからshiftにその階層をさすようにforEachを書かなくてはいけない
                    shiftLookup[shift.date] = shift.mode;
                });

                tbody2.appendChild(tr);
                tr.appendChild(td);


                const count = tbody.childElementCount;




                for (let i = 1; i <= days; i++) {//曜日に出勤日と希望休を入れるところ
                    // const shiftTd = document.createElement('td');
                    // shiftTd.textContent = "希望";
                    // tr.appendChild(shiftTd);

                    const shiftTd = document.createElement('td');
                    const dateStr = `${2026}-${String(6).padStart(2, '0')}-${String(i).padStart(2, '0')}`;//わかんない///////////////////////////
                    const yer = shiftLookup[dateStr] || "";
                    shiftTd.textContent = yer;
                    tr.appendChild(shiftTd);

                }

                eventSetting.forEach(setting => {//イベントの参加か参加しないかの処理
                    const eventTd = document.createElement('td');

                    if (staff[setting.key] === true) {
                        eventTd.textContent = setting.TrueText;
                    } else {
                        eventTd.textContent = setting.FalseText;
                    }
                    tr.appendChild(eventTd);
                })

            });



            // tbody.appendChild(tr)
        });


        // 💡 画面を切り替えるためのJavaScriptスイッチ
        function switchPage(pageName) {
            const checkPage = document.getElementById('page-check');
            const buildPage = document.getElementById('page-build');
            if (pageName == 'check') {
                checkPage.style.display = 'block';
                buildPage.style.display = 'none';
            } else if (pageName == 'build') {
                checkPage.style.display = 'none';
                buildPage.style.display = 'block';

            }
        }

        // 画面が開いたら自動でデータを読み込む（元のロジックそのまま）
        document.addEventListener('DOMContentLoaded', function () {
            loadShifts();
        });

        function loadShifts() {
            fetch('https://overplay-patriarch-daffodil.ngrok-free.dev/api/shift', {
                method: 'GET',
                headers: {

                    'ngrok-skip-browser-warning': 'true'
                }
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('データの取得に失敗しました。');
                })
                .then(allShifts => {
                    const container = document.getElementById('admin-history-container');
                    container.innerHTML = '';

                    if (allShifts.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:#999;">提出されたシフトはまだありません。</p>';
                        return;
                    }

                    allShifts.forEach(shift => {
                        const card = document.createElement('div');
                        card.className = 'shift-card';

                        const formattedDates = shift.dates.map(item => {
                            if (typeof item === 'object') {
                                // C#のDateTime型は「2026-06-15T00:00:00」のように時間がくっついてくることがあるので、
                                // .split('T')[0] を挟んで日付だけに整えてあげるとさらに見やすくなります！
                                const cleanDate = item.date.split('T')[0];
                                return `${cleanDate} (${item.mode})`; // 例：「2026-06-15 (休み)」
                            }
                            return item;
                        }).join('<br>');

                        card.innerHTML = `
                            <div class="staff-name">👤 ${shift.name} (${shift.year}年${shift.month}月分)</div>
                            <div class="date-list">
                                <strong>希望内容：</strong><br>
                                ${formattedDates}
                            </div>
                            <div class="text-name">📝 備考欄</div>
                            <div class="text-message">${shift.memo || '（なし）'}</div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('エラー:', error);
                    alert('シフトデータの読み込みに失敗しました。');
                });
        }
    </script>
</body>

</html>
